name = "GGMCollatz"
defaultTargets = ["GGMCollatz"]

# Lean 4 formalization accompanying "A power saving in natural density for generalized Collatz maps".
# The maps of Goncalves, Greenfeld and Madrid: the seed (fixed-barrier estimate), their Propositions 3.1, 3.5,
# 4.1 and 5.1, the one-step recursion, Theorem A (logarithmic density), the uniform first passage, the top
# conversion, Theorem B (natural density) and the reduction to condition (d). The only dependency is Mathlib.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "GGMCollatz"
globs = ["GGMCollatz.+"]
